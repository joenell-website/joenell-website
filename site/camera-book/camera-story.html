<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose Your Camera · Joe Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1e1c1d}
body{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#ece8e2;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.wrap{overflow-x:clip}
.story{position:relative}
.stage{position:sticky;top:0;height:min(920px,100svh);min-height:560px;z-index:0;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage svg path{fill:none;stroke:#57514c;stroke-width:1;stroke-dasharray:1 1;opacity:0}
.ticker{position:absolute;right:max(24px,calc((100% - 1320px)/2));bottom:28px;width:min(420px,calc(100% - 48px));height:46px;background:#141313;border-radius:12px;z-index:3}
.ticks,.track{position:absolute;inset:11px 20px}
.ticks{display:flex;justify-content:space-between;align-items:center}
.ticks b{display:block;width:1px;background:#6d6763;flex:none}
.cursor{position:absolute;top:0;bottom:0;left:0;width:3px;margin-left:-1.5px;border-radius:2px;background:#e5483b}
.overlay{position:relative;z-index:1;margin-top:calc(-1 * min(920px,100svh))}
@supports not (height:100svh){.stage{height:min(920px,100vh)}.overlay{margin-top:calc(-1 * min(920px,100vh))}}
section.ch{position:relative}
.pin{position:sticky;top:0;height:min(920px,100svh);min-height:560px;padding:56px max(24px,calc((100% - 1320px)/2)) 96px;display:flex;flex-direction:column;justify-content:center;pointer-events:none}
@supports not (height:100svh){.pin{height:min(920px,100vh)}}
.col{width:min(440px,100%);display:flex;flex-direction:column;gap:20px;pointer-events:auto}
.dark{color:#ece8e2}.light{color:#2b2926}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
h1,h2{margin:0;font-weight:700;letter-spacing:-.028em;line-height:1.0;text-wrap:balance}
h1{font-size:68px}
h2{font-size:56px}
.lede{margin:0;font-size:19px;line-height:1.5}
.dark .lede{color:#cfc9c2}.light .lede{color:#3d3936}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1.5px solid #3b3637;transition:border-color .2s,background .2s}
.pick:hover{border-color:#6b6365}
.pick[aria-pressed="true"]{border-color:#ece8e2;background:rgba(255,255,255,.07)}
.pick:focus-visible,.btn:focus-visible,.lab:focus-visible{outline:2px solid #e5483b;outline-offset:3px}
.pick .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a49b95}
.pick[aria-pressed="true"] .tag{color:#ff6a5c}
.pick .nm{font-size:17px;font-weight:600;line-height:1.2;color:#ece8e2}
.pick .sb{font-size:13px;line-height:1.35;color:#a49b95}
.hint{font-size:13px;color:#a49b95;display:flex;gap:8px;align-items:center}
.hint svg{width:14px;height:14px;flex:none}
.specs{display:grid;border-top:1px solid #3b3637}
.specs div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid #3b3637;font-size:15px}
.specs dt{color:#a49b95;font-size:12px;letter-spacing:.1em;text-transform:uppercase;align-self:center}
.specs dd{margin:0}
.labels{position:absolute;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:14px;pointer-events:auto}
.labels.r{top:52px;right:max(24px,calc((100% - 1320px)/2));align-items:flex-end}
.labels.l{bottom:96px;left:max(24px,calc((100% - 1320px)/2));align-items:flex-start}
.lab{all:unset;cursor:pointer;color:#2b2926;padding:1px 0;transition:color .2s}
.lab:hover{color:#c23a2c}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:6px 10px;border-radius:99px;border:1px solid #a8a09a;color:#3d3936}
.arrows{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.arrows li{display:flex;gap:10px;align-items:baseline;color:#cfc9c2}
.arrows svg{flex:none;width:14px;height:14px;transform:translateY(2px)}
.lcd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#121111;border:1px solid #2d2a2b;border-radius:12px;padding:12px 14px}
.lcd span{font-size:14px;font-weight:500}
.lcd small{display:block;font-size:10px;letter-spacing:.1em;color:#7d7571;text-transform:uppercase;margin-bottom:2px}
.legend{background:#1c1b1b;color:#ece8e2;border-radius:16px;padding:18px 20px;display:grid;gap:12px}
.legend h3{margin:0;font-size:18px;font-weight:600;display:flex;justify-content:space-between}
.legend ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:14px}
.legend li{display:flex;gap:8px;align-items:center;min-width:0}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.bar{display:flex;height:6px;border-radius:9px;overflow:hidden;background:#2d2a2b}
.bar b{display:block;height:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{all:unset;cursor:pointer;font-weight:600;font-size:15px;padding:13px 18px;border-radius:10px;background:#ece8e2;color:#1e1c1d}
.btn.ghost{background:transparent;color:#ece8e2;box-shadow:inset 0 0 0 1.5px #4a4446}
@media (max-width:899px){
  .pin{justify-content:flex-end;padding:0 16px 84px}
  .col{width:100%;gap:14px;padding:18px;border-radius:18px}
  .dark .col{background:rgba(30,28,29,.92)}
  .light .col{background:rgba(213,208,202,.94)}
  h1{font-size:40px}h2{font-size:36px}.lede{font-size:16px}
  .labels{display:none}
  .pick{min-height:0;padding:10px 12px}.pick .sb{display:none}
  .ticker{left:16px;right:16px;width:auto;bottom:18px;height:40px}
  .stage svg{display:none}
}
</style>
</head>
<body>
<div class="wrap">
<div class="story" id="story">
  <div class="stage" id="stage">
    <canvas id="cv" aria-hidden="true"></canvas>
    <svg aria-hidden="true" id="lines"></svg>
    <div class="ticker" aria-hidden="true"><div class="ticks" id="ticks"></div><div class="track"><i class="cursor" id="cursor"></i></div></div>
  </div>
  <div class="overlay" id="overlay"></div>
</div>
</div>

    /* blades: n quads from an inner polygon to an outer circle; used in 3D and in the HUD */

          var p0x = Math.cos(a0) * r, p0y = Math.sin(a0) * r, p1x = Math.cos(a1) * r, p1y = Math.sin(a1) * r;
          var o0x = Math.cos(a0 + tw) * Ro, o0y = Math.sin(a0 + tw) * Ro, o1x = Math.cos(a1 + tw) * Ro, o1y = Math.sin(a1 + tw) * Ro;

          lb.path.setAttribute('d', 'M' + sx2.toFixed(1) + ' ' + sy.toFixed(1) + ' H' + ex2.toFixed(1) + ' L' + pp[0].toFixed(1) + ' ' + pp[1].toFixed(1));
          lb.path.style.opacity = String(draw);
          lb.path.style.strokeDashoffset = String(1 - draw);
          lb.path.style.stroke = (highlight === lb.key) ? '#e5483b' : '';
          if (el) el.style.opacity = String(.25 + .75 * clamp(Lw * 1.5 - li2 * .04));
        }
      }

      /* progress */
      if (o.cursor) {
        var rr3 = root.getBoundingClientRect();
        o.cursor.style.left = (clamp((sr.top - rr3.top) / Math.max(1, rr3.height - H)) * 100).toFixed(2) + '%';
      }

      gl.clear();
      gl.render(scene, cam);
      if (hud.visible) gl.render(hudScene, hudCam);
    }

    setModel(o.model || 'canon-r');
    resize();
    raf = requestAnimationFrame(frame);

    return {
      setModel: setModel,
      setHighlight: function (k) { highlight = k || null; },
      scene: function () { return active; },
      dispose: function () { dead = true; cancelAnimationFrame(raf); try { gl.dispose(); } catch (e) {} }
    };
  }

  window.JSCameraStage = JSCameraStage;
})();

</script>
<script>
(function(){
  var K = window.JS_CONTENT, $ = function(id){return document.getElementById(id);};
  var esc = function(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var model = 'canon-r', engine = null;
  var arrow = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  $('ticks').innerHTML = Array.from({length:60},function(_,i){return '<b style="height:'+(i%10===0?80:(i%2?34:52))+'%"></b>';}).join('');
  $('lines').innerHTML = K.SLOTS.map(function(){return '<path pathLength="1"></path>';}).join('');
  function M(){ return K.MODELS.filter(function(m){return m.id===model;})[0]; }
  function render(){
    var m = M(), names = K.labelNames(model), st = K.settings(m.brand);
    var h = '';
    h += '<section class="ch dark" data-scene="hero" style="height:1100px"><div class="pin"><div class="col">'
      + '<div class="eyebrow mono">Joe Studio · Camera Book</div><h1>Choose your camera.</h1>'
      + '<p class="lede">Pick the body closest to the one in your hands. Every name, button and setting in this book follows your choice.</p>'
      + '<div class="picks" role="group" aria-label="Camera bodies">' + K.MODELS.map(function(x,i){return '<button class="pick" data-i="'+i+'" aria-pressed="'+(x.id===model)+'"><span class="tag mono">'+x.tag+'</span><span class="nm">'+x.name+'</span><span class="sb">'+x.sub+'</span></button>';}).join('') + '</div>'
      + '<div class="hint mono">'+arrow.replace('M5 12h12M12 6l6 6-6 6','M12 5v12M6 12l6 6 6-6')+'Scroll to meet your camera</div></div></div></section>';
    h += '<section class="ch dark" data-scene="meet" style="height:1500px"><div class="pin"><div class="col">'
      + '<div class="eyebrow mono">'+m.tag+' · '+m.name+'</div><h2>'+m.title+'</h2><p class="lede">'+m.desc+'</p>'
      + '<dl class="specs">'+m.specs.map(function(s){return '<div><dt class="mono">'+s[0]+'</dt><dd>'+s[1]+'</dd></div>';}).join('')+'</dl></div></div></section>';
    h += '<section class="ch light" data-scene="anatomy" style="height:2000px"><div class="pin" style="justify-content:flex-start;padding-top:64px"><div class="col">'
      + '<div class="eyebrow mono">Anatomy</div><h2>Every control, exactly where it lives.</h2><p class="lede">Twelve parts you touch on almost every shot. Point at a name to find it on your '+m.tag+'.</p></div>'
      + '<ul class="labels r mono">'+names.slice(0,6).map(function(n,i){return '<li><button class="lab" data-k="'+K.SLOTS[i]+'" data-i="'+i+'">'+n+'</button></li>';}).join('')+'</ul>'
      + '<ul class="labels l mono">'+names.slice(6).map(function(n,i){return '<li><button class="lab" data-k="'+K.SLOTS[i+6]+'" data-i="'+(i+6)+'">'+n+'</button></li>';}).join('')+'</ul></div></section>';
    h += '<section class="ch light" data-scene="explode" style="height:1900px"><div class="pin"><div class="col">'
      + '<div class="eyebrow mono">Inside</div><h2>Take it apart.</h2><p class="lede">Under the shell: a sensor that records light, a shutter that times it and glass that bends it into focus. Stop scrolling and watch every piece drift.</p>'
      + '<div class="chips mono">'+K.internals(model).map(function(x){return '<span>'+x+'</span>';}).join('')+'</div></div></div></section>';
    st.forEach(function(s){
      h += '<section class="ch dark" data-scene="'+s.id+'" style="height:1300px"><div class="pin"><div class="col">'
        + '<div class="eyebrow mono" style="color:'+s.color+';opacity:1">'+s.group+' · '+s.num+'</div><h2 style="color:'+s.color+'">'+s.title+'</h2><p class="lede">'+s.body+'</p>'
        + '<ul class="arrows mono">'+s.items.map(function(x){return '<li style="--c:'+s.color+'"><span style="color:'+s.color+'">'+arrow+'</span>'+x+'</li>';}).join('')+'</ul>'
        + '<div class="lcd mono">'+['Mode','Value','Value','Value'].map(function(_,i){return '<div><small>'+(i===0?'Mode':(s.id==='focus'?['','Detect','Area','Track'][i]:(s.id==='wb'?['','Temp','Look','File'][i]:['','Aperture','Shutter','ISO'][i])))+'</small><span>'+s.lcd[i]+'</span></div>';}).join('')+'</div></div></div></section>';
    });
    h += '<section class="ch light" data-scene="kit" style="height:1900px"><div class="pin"><div class="col">'
      + '<div class="eyebrow mono">Kit</div><h2>Build a kit that grows with you.</h2><p class="lede">Start with the camera. Add a piece only when your photos need it.</p>'
      + '<div class="legend"><h3>Your kit <span class="mono" style="font-weight:400;color:#a49b95">8 pieces</span></h3><div class="bar">'+K.KIT.map(function(k){return '<b style="flex:1;background:'+k[1]+'"></b>';}).join('')+'</div>'
      + '<ul>'+K.KIT.map(function(k){return '<li><i style="background:'+k[1]+'"></i><span>'+k[0]+'</span></li>';}).join('')+'</ul></div></div></div></section>';
    h += '<section class="ch dark" data-scene="end" style="height:1000px"><div class="pin"><div class="col">'
      + '<div class="eyebrow mono">Next</div><h2>You know your camera. Now make it sing.</h2><p class="lede">Chapter 1 puts aperture, shutter speed and ISO in your hands with a live simulator.</p>'
      + '<div class="btns"><button class="btn" data-go="hero">Pick another camera</button><button class="btn ghost" data-go="anatomy">Back to anatomy</button></div></div></div></section>';
    $('overlay').innerHTML = h;
  }
  render();
  $('overlay').addEventListener('click', function(e){
    var p = e.target.closest('.pick');
    if (p) { model = K.MODELS[+p.dataset.i].id; render(); if (engine) engine.setModel(model); return; }
    var g = e.target.closest('[data-go]');
    if (g) { var s = document.querySelector('[data-scene="'+g.dataset.go+'"]'); if (s) s.scrollIntoView({behavior:'smooth'}); }
  });
  $('overlay').addEventListener('mouseover', function(e){ var l = e.target.closest('.lab'); if (engine) engine.setHighlight(l ? l.dataset.k : null); });
  $('overlay').addEventListener('focusin', function(e){ var l = e.target.closest('.lab'); if (engine) engine.setHighlight(l ? l.dataset.k : null); });
  var paths = Array.prototype.slice.call(document.querySelectorAll('#lines path'));
  engine = window.JSCameraStage({
    canvas: $('cv'), stage: $('stage'), root: $('story'), cursor: $('cursor'), model: model,
    labels: function(){
      var els = document.querySelectorAll('.lab');
      return paths.map(function(p,i){ var el = els[i]; return { el: el, path: p, key: K.SLOTS[i], side: i < 6 ? 'right' : 'left' }; });
    }
  });
})();
</script>
