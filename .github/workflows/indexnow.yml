name: IndexNow ping
# After each push to main, wait for Cloudflare Pages to deploy, then tell
# Bing/Yandex/Seznam (IndexNow) which pages changed. Free, no account needed.
on:
  push:
    branches: [main]
    paths: ['site/**']
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Wait for Cloudflare Pages deploy
        run: sleep 120
      - name: Submit changed URLs to IndexNow
        env:
          KEY: aa7370daa749fa508842392dffef1105
          HOST: www.joenellphotography.ca
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          host = os.environ['HOST']; key = os.environ['KEY']
          changed = subprocess.run(['git','diff','--name-only','HEAD~1','HEAD','--','site/'],capture_output=True,text=True).stdout.split()
          sitemap = re.findall(r'<loc>([^<]+)</loc>', open('site/sitemap.xml').read())
          urls = set()
          for f in changed:
              if not f.endswith('.html'): continue
              p = f[len('site/'):-len('.html')]
              p = '' if p == 'index' else p
              p = re.sub(r'/index$', '/', p)
              u = f'https://{host}/{p}'
              if u in sitemap or u.rstrip('/') in sitemap or u + '/' in sitemap: urls.add(u)
          if any(f.endswith('sitemap.xml') for f in changed) or len(urls) > 40:
              urls = set(sitemap)
          if not urls:
              print('No page URLs changed; nothing to submit.'); raise SystemExit
          body = json.dumps({'host': host, 'key': key, 'keyLocation': f'https://{host}/{key}.txt', 'urlList': sorted(urls)[:10000]}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              r = urllib.request.urlopen(req, timeout=30); print('IndexNow', r.status, len(urls), 'URLs')
          except urllib.error.HTTPError as e:
              print('IndexNow HTTP', e.code, e.read()[:300])
          PY
